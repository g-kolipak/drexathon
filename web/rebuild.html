<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unshred with Drex</title>
<style>
  :root { --bg: #f6f5f2; --ink: #1d1d1b; --muted: #6b6a66; --card: #ffffff;
          --line: #dcdad4; --accent: #1f6feb; --ok: #1a7f37; --bad: #c62828; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--ink); }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  #drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--card);
          padding: 28px; text-align: center; cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  button { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { background: #9db6e0; cursor: default; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .card img { width: 100%; height: auto; display: block; border-radius: 6px; background: #222; }
  #log { font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
         background: #111; color: #d8f3dc; border-radius: 8px; padding: 12px;
         max-height: 320px; overflow: auto; margin-top: 16px; }
  #state { margin-top: 12px; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Unshred with Drex</h1>
  <p class="sub">Drop a photo of torn or shredded paper pieces. Every decision (what is paper,
    which way is up, which pieces join, the final page) is made by Drex Max.</p>
  <div id="drop">Drop a photo here, or click to choose one
    <input id="file" type="file" accept="image/*" hidden>
    <div><button id="go" disabled>Rebuild the page</button></div>
  </div>
  <div id="state"></div>
  <div class="grid">
    <div class="card"><h2>Your photo</h2><img id="before" alt="Uploaded photo"></div>
    <div class="card"><h2>Rebuilt by Drex</h2><img id="after" alt="Rebuilt page"></div>
  </div>
  <div id="log"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let chosen = null;
  function pick(file) {
    if (!file || !file.type.startsWith("image/")) return;
    chosen = file;
    $("before").src = URL.createObjectURL(file);
    $("after").removeAttribute("src");
    $("go").disabled = false;
    $("state").textContent = file.name + " ready";
  }
  $("drop").onclick = (e) => { if (e.target.id !== "go") $("file").click(); };
  $("file").onchange = (e) => pick(e.target.files[0]);
  $("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
  $("drop").ondragleave = () => $("drop").classList.remove("over");
  $("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over");
                              pick(e.dataTransfer.files[0]); };
  $("go").onclick = async (e) => {
    e.stopPropagation();
    if (!chosen) return;
    $("go").disabled = true;
    $("state").textContent = "Uploading…";
    const res = await fetch("/api/rebuild", { method: "POST", body: chosen,
                                              headers: { "Content-Type": "application/octet-stream" } });
    if (!res.ok) { $("state").innerHTML = '<span class="bad">Upload failed</span>'; $("go").disabled = false; return; }
    const { id } = await res.json();
    const t0 = performance.now();
    const timer = setInterval(async () => {
      const r = await fetch("/api/rebuild/" + id);
      const job = await r.json();
      $("log").textContent = job.log.join("\n");
      $("log").scrollTop = $("log").scrollHeight;
      const s = ((performance.now() - t0) / 1000).toFixed(0);
      if (job.status === "running") { $("state").textContent = "Drex is rebuilding… " + s + " s"; return; }
      clearInterval(timer);
      $("go").disabled = false;
      if (job.status === "done") {
        $("after").src = "/api/rebuild/" + id + "/image?t=" + Date.now();
        $("state").innerHTML = '<span class="ok">Done in ' + s + ' s</span>';
      } else {
        $("state").innerHTML = '<span class="bad">Could not rebuild this photo (see the log)</span>';
      }
    }, 1000);
  };
</script>
</body>
</html>
